name: Docker 构建和发布

on:
  push:
    branches:
      - main
  schedule:
    - cron: "33 3 26 * *"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4  # 升级至 v4，支持 Node 24

      - name: 构建用于提取Nginx版本的镜像
        run: docker build -t nginx-extras-test -f Dockerfile-test .

      - name: 获取 nginx 原始完整版本
        id: get-raw-version
        run: |
          RAW_FULL=$(docker run --rm nginx-extras-test cat /tmp/nginx_extras_version.txt)
          echo "raw_full=$RAW_FULL" >> $GITHUB_OUTPUT

      - name: 检查版本并跳过构建和推送
        id: check-version
        run: |
          # 使用完整的带 + 号的版本与仓库中的 version 文件进行精准对比
          if [ "${{ steps.get-raw-version.outputs.raw_full }}" = "$(cat version 2>/dev/null)" ]; then
            echo "版本 ${{ steps.get-raw-version.outputs.raw_full }} 已存在，跳过构建和推送。"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "版本 ${{ steps.get-raw-version.outputs.raw_full }} 不同，继续进行构建和推送。"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 解析多级 Docker 标签
        if: steps.check-version.outputs.skip != 'true'
        id: parse-tags
        run: |
          RAW_FULL="${{ steps.get-raw-version.outputs.raw_full }}"
          
          # 1. 转换为 Docker 安全的标签 (把 + 换成 _) -> 对应 1.26.3-3_deb13u5
          TAG_FULL=$(echo "$RAW_FULL" | tr '+' '_')
          echo "tag_full=$TAG_FULL" >> $GITHUB_OUTPUT
          
          # 2. 提取 1.26.3-3
          TAG_DEB=$(echo "$RAW_FULL" | cut -d '+' -f 1)
          echo "tag_deb=$TAG_DEB" >> $GITHUB_OUTPUT
          
          # 3. 提取 1.26.3
          TAG_MAIN=$(echo "$TAG_DEB" | cut -d '-' -f 1)
          echo "tag_main=$TAG_MAIN" >> $GITHUB_OUTPUT
          
          # 4. 提取 1.26
          TAG_MINOR=$(echo "$TAG_MAIN" | cut -d '.' -f 1-2)
          echo "tag_minor=$TAG_MINOR" >> $GITHUB_OUTPUT

      - name: 设置构建时间戳
        if: steps.check-version.outputs.skip != 'true'
        id: set-timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        if: steps.check-version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3  # 升级至 v3，移除内部遗留的老语法并全面支持 Node 24

      - name: 登录到 Docker Hub
        if: steps.check-version.outputs.skip != 'true'
        uses: docker/login-action@v3  # 升级至 v3

      - name: 构建并推送 Docker 镜像
        if: steps.check-version.outputs.skip != 'true'
        uses: docker/build-push-action@v5  # 升级至 v5

        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_full }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_deb }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_deb }}-${{ steps.set-timestamp.outputs.timestamp }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ secrets.parse-tags.outputs.tag_main }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_main }}-${{ secrets.set-timestamp.outputs.timestamp }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_minor }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-extras:${{ steps.parse-tags.outputs.tag_minor }}-${{ steps.set-timestamp.outputs.timestamp }}

      - name: 更新版本文件
        if: steps.check-version.outputs.skip != 'true'
        run: |
          # 将包含 + 号的完整原始版本写入 version 文件，用于下次比对
          echo "${{ steps.get-raw-version.outputs.raw_full }}" > version

      - name: 上传版本文件
        if: steps.check-version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4  # 保持最新的 v4

        with:
          name: version
          path: version

      - name: 更新仓库中的版本文件
        if: steps.check-version.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          git commit -m "更新版本 - 北京时间: $current_time"
          git push

      - name: 将运行时间推送更新到 GitHub
        run: |
          echo $(date +"%Y-%m-%d %H:%M:%S") > time
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add time
          current_time=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
          git commit -m "运行时间 - 北京时间: $current_time"
          git push origin main
